    <section id="chess" hidden>
      <div class="game-top"><h2 id="chess-title"></h2><button id="chess-menu" class="secondary" aria-haspopup="dialog">更多</button><button id="chess-fullscreen" class="secondary" aria-pressed="false">全屏</button><button class="secondary leave" aria-label="退出房间">退出</button></div>
      <div class="chess-status"><strong id="turn" role="status"></strong><span id="my-color" class="muted"></span><button id="rematch" class="primary" hidden>再来一局</button><strong id="clock" class="clock" aria-label="本步剩余时间">--:--</strong></div>
      <div class="board-panel"><div class="board-wrap"><aside id="red-captured" class="captured red" aria-label="红方阵亡"></aside><div id="board" class="board" aria-label="四列八行翻棋棋盘"></div><aside id="black-captured" class="captured black" aria-label="黑方阵亡"></aside></div></div>
      <div id="chess-members" class="member-connections" aria-label="对局成员与连接状态"></div>
    </section>
    <dialog id="chess-menu-dialog" aria-labelledby="chess-menu-title"><div class="dialog-heading"><h2 id="chess-menu-title">对局操作</h2><button class="dialog-close" aria-label="关闭">×</button></div><div class="chess-menu-actions"><button class="secondary rules-link">查看规则</button><button id="chess-offer-draw" class="secondary">请求和棋</button><button id="chess-surrender" class="danger">投降</button></div><p class="small muted">和棋需对方同意；等待答复时计时继续，走棋后请求失效。</p></dialog>
    <dialog id="chess-draw-dialog" aria-labelledby="chess-draw-title"><h2 id="chess-draw-title">对方请求和棋</h2><p>同意后本局以和棋结束。等待答复时计时继续。</p><div class="dialog-actions"><button id="chess-decline-draw" class="secondary">继续对局</button><button id="chess-accept-draw" class="primary">同意和棋</button></div></dialog>
