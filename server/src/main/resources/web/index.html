<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c141e"><title>赛博房间</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><script src="./android-bridge.js"></script><script type="module" src="./app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="./"><img src="./icon.svg" width="34" height="34" alt=""><span>赛博房间<small>CYBER ROOM</small></span></a><span id="status" role="status">正在连接…</span><div class="actions"><button id="settings-open" class="secondary">设置</button><button id="close-plugin" class="secondary" hidden>返回大厅</button></div></header>
<main id="home">
  <section class="intro"><p class="eyebrow">YOUR ROOM, YOUR CHOICE</p><h1>留一间房，给你的朋友。</h1><p class="muted">翻一局棋，淘一座矿，或共享今晚的电影。</p></section>
  <section><div class="section-heading"><h2>一起玩点什么</h2><button id="market-open" class="primary">浏览插件市场 ↗</button></div><p id="installed-empty" class="empty" hidden>还没有安装插件。打开市场，选择你喜欢的功能。</p><div id="installed" class="cards"></div></section>
  <section><div class="section-heading"><h2>朋友的房间</h2><button id="refresh" class="secondary">刷新</button></div><p id="rooms-empty" class="empty">正在连接服务器…</p><div id="rooms" class="rooms"></div></section>
  <footer><span id="version">赛博房间</span><span class="downloads"><a id="download-app" href="/api/app/latest.apk?versionCode=0">下载 Android</a><a id="download-desktop" href="/api/desktop/latest.exe">下载 Windows</a></span><a href="https://github.com/LinHuiG/chinese-chess-flipping" target="_blank" rel="noopener">开源代码 · AGPL-3.0</a></footer>
</main>
<section id="plugin-container" hidden aria-label="插件运行区域"></section>
<dialog id="market-dialog" class="wide-dialog"><div class="section-heading"><div><p class="eyebrow">PLUGIN MARKET</p><h2>找到下一份乐趣</h2></div><button class="dialog-close secondary">关闭</button></div><input id="market-search" type="search" placeholder="搜索插件名称"><p id="market-status" class="muted"></p><div id="market-list" class="cards"></div><button id="market-refresh" class="secondary">刷新市场</button></dialog>
<dialog id="create-dialog"><form id="create-form"><div class="section-heading"><h2 id="create-title">创建房间</h2><button type="button" class="dialog-close secondary">关闭</button></div><label>房间名称<input id="room-name" maxlength="32" required></label><label>人数<select id="capacity"></select></label><label>房间密码（可选）<input id="create-password" type="password" maxlength="64" autocomplete="new-password"></label><label id="load-row" class="checkbox" hidden><input id="load-save" type="checkbox">继续本机保存的进度</label><p class="muted">房间创建后固定使用此插件，更换功能需退出并重新建房。</p><button id="create-submit" type="submit" class="primary">创建并进入</button></form></dialog>
<dialog id="password-dialog"><form id="password-form"><h2>输入房间密码</h2><input id="password-value" type="password" maxlength="64" autocomplete="off"><div class="actions"><button type="button" class="dialog-close secondary">取消</button><button type="submit" class="primary">加入房间</button></div></form></dialog>
<dialog id="settings-dialog"><form id="settings-form"><div class="section-heading"><h2>设置</h2><button type="button" class="dialog-close secondary">关闭</button></div><label>昵称<input id="nickname" maxlength="24"></label><label class="checkbox"><input id="sound" type="checkbox">游戏音效</label><label class="checkbox"><input id="motion" type="checkbox">装饰动画</label><div id="native-settings" hidden><label>连接方式<select id="server-mode"><option>TCP</option><option>HTTP</option><option>HTTPS</option></select></label><label>服务器地址<input id="server-host" autocomplete="off"></label><label>端口<input id="server-port" type="number" min="1" max="65535"></label><button id="restore-default" type="button" class="secondary">恢复默认服务器</button></div><label>插件市场地址<input id="market-url" type="url" required></label><p class="muted">只接受本客户端信任的发布签名。</p><div id="updates" hidden><p id="update-status"></p><button id="check-update" type="button" class="secondary">检查更新</button><button id="install-update" type="button" class="secondary" hidden>安装更新</button></div><button class="primary" type="submit">保存设置</button></form></dialog>
<aside id="download-progress" class="download-progress" hidden aria-live="polite"><div><strong id="download-name"></strong><button id="download-dismiss" aria-label="收起下载进度">×</button></div><progress id="download-bar" max="1" value="0" aria-label="插件下载进度"></progress><p id="download-detail"></p></aside>
<div id="toast" role="status" hidden></div>
</body></html>
