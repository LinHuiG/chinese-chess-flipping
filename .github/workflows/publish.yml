name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.scope.outputs.publish_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check server changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          publish_image=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            publish_image=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base=$(git hash-object -w -t tree /dev/null)
            else
              git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
            fi
            changed_files=$(git diff --name-only "$base" "$GITHUB_SHA" -- server/)
            if [[ -n "$changed_files" ]]; then publish_image=true; fi
          fi
          echo "publish_image=$publish_image" >> "$GITHUB_OUTPUT"
          echo "Publish image: $publish_image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Rust server
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --manifest-path server/Cargo.toml
          cargo +stable build --locked --release --manifest-path server/Cargo.toml
      - name: Android rules and real Rust interoperability
        env:
          CHESS_RUST_BINARY: ${{ github.workspace }}/server/target/release/chess-server
        run: mvn --batch-mode --no-transfer-progress -f server/pom.xml verify
  publish:
    if: needs.test.outputs.publish_image == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
