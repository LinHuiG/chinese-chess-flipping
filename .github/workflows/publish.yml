name: Test and publish Docker image
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'android_client/**'
      - 'scripts/package-app-update.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# 同一分支按次发布，避免较早的构建晚结束后覆盖 latest。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.scope.outputs.publish_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check application changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          publish_image=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            publish_image=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base=$(git hash-object -w -t tree /dev/null)
            else
              git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
            fi
            changed_files=$(git diff --name-only "$base" "$GITHUB_SHA" -- server/ android_client/ scripts/package-app-update.py)
            if [[ -n "$changed_files" ]]; then publish_image=true; fi
          fi
          echo "publish_image=$publish_image" >> "$GITHUB_OUTPUT"
          echo "Publish image: $publish_image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-check-${{ runner.os }}-${{ hashFiles('server/Cargo.lock', 'server/Cargo.toml', 'server/src/*.rs') }}
          restore-keys: rust-check-${{ runner.os }}-
      # Only a main push or manual publish receives the fixed signing key. PRs use disposable debug signing.
      - name: Build signed update APK
        if: steps.scope.outputs.publish_image == 'true'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE: ${{ runner.temp }}/app-signing.keystore
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          for key in APK_KEYSTORE_B64 APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "Missing repository secret: $key" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$APK_KEYSTORE"
          unset APK_KEYSTORE_B64
          android_client/gradlew -p android_client --no-daemon --build-cache assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android_client/app/build/outputs/apk/release/app-release.apk
          python3 scripts/package-app-update.py --release
      - name: Build debug APK for checks
        if: steps.scope.outputs.publish_image != 'true'
        run: |
          android_client/gradlew -p android_client --no-daemon --build-cache assembleDebug
          python3 scripts/package-app-update.py
      - name: Verify update manifest
        run: python3 scripts/package-app-update.py --check
      - name: Build Rust server
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --manifest-path server/Cargo.toml
          cargo +stable build --locked --release --manifest-path server/Cargo.toml
      - name: Check Android recovery and TCP / WS / update interoperability
        env:
          TCP_PORT: '18888'
          HTTP_PORT: '18880'
          UDP_PORT: '18888'
          CHESS_TEST_TCP_PORT: '18888'
          CHESS_TEST_HTTP_PORT: '18880'
        run: |
          set -euo pipefail
          server/target/release/chess-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18880/api/app/version?versionCode=0' > /dev/null; then break; fi
            sleep 1
          done
          # 验证网页来自镜像资源目录，保留 HEAD 与未知路径行为。
          curl --fail --silent http://127.0.0.1:18880/game.js | cmp - server/src/main/resources/web/game.js
          curl --fail --silent --head http://127.0.0.1:18880/rules.txt
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18880/missing)" = 404
          android_client/gradlew -p android_client --no-daemon --build-cache testDebugUnitTest lintDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser game recovery and protocol
        run: node scripts/session-v2-test.mjs
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.publish_image == 'true'
        with:
          name: app-update
          path: |
            server/app-update/latest.apk
            server/app-update/latest.json
          if-no-files-found: error
  publish:
    name: Publish ${{ matrix.arch }}
    if: needs.test.outputs.publish_image == 'true'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-update
          path: server/app-update
      - name: Lowercase image name
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest-${{ matrix.arch }},enable={{is_default_branch}}
            type=sha,suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./server
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Verify packaged runtime resources
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'docker rm -f release-check >/dev/null 2>&1 || true' EXIT
          docker run --detach --name release-check --publish 127.0.0.1:18880:80 "$IMAGE@$DIGEST"
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18880/api/app/version?versionCode=0' > "$RUNNER_TEMP/version.json"; then break; fi
            sleep 1
          done
          docker logs release-check
          python3 -c 'import json,sys; actual=json.load(open(sys.argv[1])); expected=json.load(open("server/app-update/latest.json")); assert all(actual[k]==v for k,v in expected.items())' "$RUNNER_TEMP/version.json"
          curl --fail --silent http://127.0.0.1:18880/game.js | cmp - server/src/main/resources/web/game.js
          curl --fail --silent 'http://127.0.0.1:18880/api/app/latest.apk?versionCode=0' | cmp - server/app-update/latest.apk
      # 各架构直接发布可用标签；最终合并使用本次构建的 digest，不能读可变 latest 标签。
      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}
          if-no-files-found: error
  merge:
    name: Publish multi-platform manifest
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 只有两个架构都成功才到此步骤；仅合并清单，不重新编译或等待 QEMU。
      - name: Combine the two published architectures
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tags=(-t "$image:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$image@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$image@$(cat "$RUNNER_TEMP/digests/arm64")"
