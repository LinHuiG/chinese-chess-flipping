name: Test and publish Docker image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.scope.outputs.publish_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check application changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          publish_image=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            publish_image=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base=$(git hash-object -w -t tree /dev/null)
            else
              git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
            fi
            changed_files=$(git diff --name-only "$base" "$GITHUB_SHA" -- server/ android_client/ scripts/package-app-update.py .github/workflows/publish.yml)
            if [[ -n "$changed_files" ]]; then publish_image=true; fi
          fi
          echo "publish_image=$publish_image" >> "$GITHUB_OUTPUT"
          echo "Publish image: $publish_image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      # Only a main push or manual publish receives the fixed signing key. PRs use disposable debug signing.
      - name: Build signed update APK
        if: steps.scope.outputs.publish_image == 'true'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE: ${{ runner.temp }}/app-signing.keystore
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          for key in APK_KEYSTORE_B64 APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "Missing repository secret: $key" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$APK_KEYSTORE"
          unset APK_KEYSTORE_B64
          android_client/gradlew -p android_client --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android_client/app/build/outputs/apk/release/app-release.apk
          python3 scripts/package-app-update.py --release
      - name: Build debug APK for checks
        if: steps.scope.outputs.publish_image != 'true'
        run: |
          android_client/gradlew -p android_client --no-daemon assembleDebug
          python3 scripts/package-app-update.py
      - name: Verify update manifest
        run: python3 scripts/package-app-update.py --check
      - name: Build Rust server
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable test --locked --manifest-path server/Cargo.toml
          cargo +stable build --locked --release --manifest-path server/Cargo.toml
      - name: Check Android recovery and TCP / WS / update interoperability
        env:
          TCP_PORT: '18888'
          HTTP_PORT: '18880'
          UDP_PORT: '18888'
          CHESS_TEST_TCP_PORT: '18888'
          CHESS_TEST_HTTP_PORT: '18880'
        run: |
          set -euo pipefail
          server/target/release/chess-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18880/api/app/version?versionCode=0' > /dev/null; then break; fi
            sleep 1
          done
          android_client/gradlew -p android_client --no-daemon testDebugUnitTest lintDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser game recovery and protocol
        run: node scripts/session-v2-test.mjs
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.publish_image == 'true'
        with:
          name: app-update
          path: |
            server/app-update/latest.apk
            server/app-update/latest.json
          if-no-files-found: error
  publish:
    if: needs.test.outputs.publish_image == 'true'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-update
          path: server/app-update
      - name: Lowercase image name
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
