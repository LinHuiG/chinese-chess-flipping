name: Test and publish Docker image
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'android_client/**'
      - 'scripts/package-app-update.py'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# 同一分支按次发布，避免较早的构建晚结束后覆盖 latest。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_apk_and_check:
    name: Build APK and run checks
    runs-on: ubuntu-latest
    outputs:
      publish_image: ${{ steps.scope.outputs.publish_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # GitHub 的 paths 在大批量推送或差异计算超时时可能放行，保留实际改动检查。
      - name: Check application changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          publish_image=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            publish_image=true
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            base="$BEFORE_SHA"
            if [[ "$base" =~ ^0+$ ]]; then
              base=$(git hash-object -w -t tree /dev/null)
            else
              git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base"
            fi
            changed_files=$(git diff --name-only "$base" "$GITHUB_SHA" -- server/ android_client/ scripts/package-app-update.py)
            if [[ -n "$changed_files" ]]; then publish_image=true; fi
          fi
          # PR 保留检查，手动运行保留强制发布；无应用改动的 push 跳过全部后续步骤。
          should_check=$publish_image
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then should_check=true; fi
          echo "should_check=$should_check" >> "$GITHUB_OUTPUT"
          echo "publish_image=$publish_image" >> "$GITHUB_OUTPUT"
          echo "Run checks: $should_check; publish image: $publish_image" >> "$GITHUB_STEP_SUMMARY"
      # 成品缓存只在所有检查成功后保存；精确匹配输入，不用前缀命中跳过测试。
      - name: Identify build and validation inputs
        if: steps.scope.outputs.should_check == 'true'
        id: inputs
        env:
          ANDROID_INPUTS: ${{ hashFiles('android_client/**', 'scripts/package-app-update.py') }}
          RUST_INPUTS: ${{ hashFiles('server/Cargo.*', 'server/src/**/*.rs', 'server/.cargo/**', 'server/build.rs', 'server/rust-toolchain*', '.cargo/**', 'rust-toolchain*') }}
          WORKFLOW_INPUTS: ${{ hashFiles('.github/workflows/publish.yml') }}
          APK_VARIANT: ${{ steps.scope.outputs.publish_image == 'true' && 'release' || 'debug' }}
          CACHE_EPOCH: ${{ vars.CI_CACHE_EPOCH || '1' }}
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          toolchain=$(rustc +stable -vV; cargo +stable -V)
          platform="${ImageOS}-${ImageVersion}-${RUNNER_ARCH}"
          apk=$(printf '%s\n' "$platform" "$CACHE_EPOCH" "$WORKFLOW_INPUTS" "$ANDROID_INPUTS" "$APK_VARIANT" | sha256sum | cut -d ' ' -f 1)
          rust=$(printf '%s\n' "$platform" "$CACHE_EPOCH" "$WORKFLOW_INPUTS" "$RUST_INPUTS" "$toolchain" | sha256sum | cut -d ' ' -f 1)
          interop=$(printf '%s\n' "$apk" "$rust" | sha256sum | cut -d ' ' -f 1)
          echo "apk=checked-apk-v1-$apk" >> "$GITHUB_OUTPUT"
          echo "rust=checked-rust-v1-$rust" >> "$GITHUB_OUTPUT"
          echo "interop=checked-interop-v1-$interop" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        if: steps.scope.outputs.should_check == 'true'
        id: apk_cache
        with:
          key: ${{ steps.inputs.outputs.apk }}
          path: |
            server/app-update/latest.apk
            server/app-update/latest.json
      - uses: actions/cache/restore@v5
        if: steps.scope.outputs.should_check == 'true'
        id: rust_cache
        with:
          key: ${{ steps.inputs.outputs.rust }}
          path: |
            server/target/release/chess-server
            .ci-cache/rust.sha256
      - uses: actions/cache/restore@v5
        if: steps.scope.outputs.should_check == 'true'
        id: interop_cache
        with:
          key: ${{ steps.inputs.outputs.interop }}
          path: .ci-cache/interop.ok
      - name: Decide required builds and checks
        if: steps.scope.outputs.should_check == 'true'
        id: required
        env:
          APK_HIT: ${{ steps.apk_cache.outputs.cache-hit }}
          RUST_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
          INTEROP_HIT: ${{ steps.interop_cache.outputs.cache-hit }}
          INTEROP_KEY: ${{ steps.inputs.outputs.interop }}
        run: |
          set -euo pipefail
          apk=true
          rust=true
          interop=true
          if [[ "$APK_HIT" == true ]] && python3 scripts/package-app-update.py --check; then apk=false; fi
          if [[ "$RUST_HIT" == true ]] && [[ -x server/target/release/chess-server ]] && sha256sum --check .ci-cache/rust.sha256; then rust=false; fi
          if [[ "$apk" == false && "$rust" == false && "$INTEROP_HIT" == true ]] && [[ -f .ci-cache/interop.ok ]] && [[ "$(cat .ci-cache/interop.ok)" == "$INTEROP_KEY" ]]; then interop=false; fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "interop=$interop" >> "$GITHUB_OUTPUT"
          echo "Required: APK/client checks=$apk; Rust build/tests=$rust; interoperability=$interop" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v5
        if: steps.required.outputs.apk == 'true' || steps.required.outputs.interop == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        if: steps.required.outputs.apk == 'true' || steps.required.outputs.interop == 'true'
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
        if: steps.required.outputs.apk == 'true' || steps.required.outputs.interop == 'true'
      - uses: actions/cache@v5
        if: steps.required.outputs.rust == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-check-${{ runner.os }}-${{ steps.inputs.outputs.rust }}
          restore-keys: rust-check-${{ runner.os }}-
      # Only a main push or manual publish receives the fixed signing key. PRs use disposable debug signing.
      - name: Build signed update APK
        if: steps.required.outputs.apk == 'true' && steps.scope.outputs.publish_image == 'true'
        env:
          APK_KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          APK_KEYSTORE: ${{ runner.temp }}/app-signing.keystore
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$APK_KEYSTORE"' EXIT
          for key in APK_KEYSTORE_B64 APK_STORE_PASSWORD APK_KEY_ALIAS APK_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "Missing repository secret: $key" >&2; exit 1; fi
          done
          umask 077
          printf '%s' "$APK_KEYSTORE_B64" | base64 --decode > "$APK_KEYSTORE"
          unset APK_KEYSTORE_B64
          android_client/gradlew -p android_client --no-daemon --build-cache assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android_client/app/build/outputs/apk/release/app-release.apk
          python3 scripts/package-app-update.py --release
      - name: Build debug APK for checks
        if: steps.required.outputs.apk == 'true' && steps.scope.outputs.publish_image != 'true'
        run: |
          android_client/gradlew -p android_client --no-daemon --build-cache assembleDebug
          python3 scripts/package-app-update.py
      - name: Verify update manifest
        if: steps.scope.outputs.should_check == 'true'
        run: python3 scripts/package-app-update.py --check
      - name: Check Android client logic and lint
        if: steps.required.outputs.apk == 'true'
        run: android_client/gradlew -p android_client --no-daemon --build-cache -PchessTestSuite=client testDebugUnitTest lintDebug
      - name: Test and build Rust server
        if: steps.required.outputs.rust == 'true'
        run: |
          cargo +stable test --locked --manifest-path server/Cargo.toml
          cargo +stable build --locked --release --manifest-path server/Cargo.toml
      - name: Check runtime resources and required interoperability
        if: steps.scope.outputs.should_check == 'true'
        env:
          TCP_PORT: '18888'
          HTTP_PORT: '18880'
          UDP_PORT: '18888'
          CHESS_TEST_TCP_PORT: '18888'
          CHESS_TEST_HTTP_PORT: '18880'
          RUN_INTEROP: ${{ steps.required.outputs.interop }}
        run: |
          set -euo pipefail
          server/target/release/chess-server &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18880/api/app/version?versionCode=0' > /dev/null; then break; fi
            sleep 1
          done
          # 验证工作目录中的网页资源，保留 HEAD 与未知路径行为。
          curl --fail --silent http://127.0.0.1:18880/game.js | cmp - server/src/main/resources/web/game.js
          curl --fail --silent --head http://127.0.0.1:18880/rules.txt
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18880/missing)" = 404
          if [[ "$RUN_INTEROP" == true ]]; then
            android_client/gradlew -p android_client --no-daemon --build-cache -PchessTestSuite=interop testDebugUnitTest
          fi
      - uses: actions/setup-node@v6
        if: steps.scope.outputs.should_check == 'true'
        with:
          node-version: '24'
      - name: Check browser game recovery and protocol
        if: steps.scope.outputs.should_check == 'true'
        run: node scripts/session-v2-test.mjs
      - name: Record successful validation
        if: steps.scope.outputs.should_check == 'true'
        env:
          INTEROP_KEY: ${{ steps.inputs.outputs.interop }}
        run: |
          mkdir -p .ci-cache
          sha256sum server/target/release/chess-server > .ci-cache/rust.sha256
          printf '%s' "$INTEROP_KEY" > .ci-cache/interop.ok
      - uses: actions/cache/save@v5
        if: steps.required.outputs.apk == 'true' && steps.apk_cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.inputs.outputs.apk }}
          path: |
            server/app-update/latest.apk
            server/app-update/latest.json
      - uses: actions/cache/save@v5
        if: steps.required.outputs.rust == 'true' && steps.rust_cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.inputs.outputs.rust }}
          path: |
            server/target/release/chess-server
            .ci-cache/rust.sha256
      - uses: actions/cache/save@v5
        if: steps.required.outputs.interop == 'true' && steps.interop_cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.inputs.outputs.interop }}
          path: .ci-cache/interop.ok
      - uses: actions/upload-artifact@v6
        if: steps.scope.outputs.publish_image == 'true'
        with:
          name: app-update
          path: |
            server/app-update/latest.apk
            server/app-update/latest.json
          if-no-files-found: error
  publish:
    name: Publish ${{ matrix.arch }}
    if: needs.build_apk_and_check.outputs.publish_image == 'true'
    needs: build_apk_and_check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: app-update
          path: server/app-update
      - name: Lowercase image name
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest-${{ matrix.arch }},enable={{is_default_branch}}
            type=sha,suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ./server
          platforms: linux/${{ matrix.arch }}
          # 先按 digest 上传，验证成功前不更新任何正式标签。
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Verify packaged runtime resources
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          trap 'docker rm -f release-check >/dev/null 2>&1 || true' EXIT
          docker run --detach --name release-check --publish 127.0.0.1:18880:80 "$IMAGE@$DIGEST"
          for attempt in {1..20}; do
            if curl --fail --silent 'http://127.0.0.1:18880/api/app/version?versionCode=0' > "$RUNNER_TEMP/version.json"; then break; fi
            sleep 1
          done
          docker logs release-check
          python3 -c 'import json,sys; actual=json.load(open(sys.argv[1])); expected=json.load(open("server/app-update/latest.json")); assert all(actual[k]==v for k,v in expected.items())' "$RUNNER_TEMP/version.json"
          curl --fail --silent http://127.0.0.1:18880/game.js | cmp - server/src/main/resources/web/game.js
          curl --fail --silent 'http://127.0.0.1:18880/api/app/latest.apk?versionCode=0' | cmp - server/app-update/latest.apk
      - name: Publish verified architecture tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tags+=(-t "$tag"); fi
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE@$DIGEST"
      # 各架构验证通过即发布标签；最终合并使用本次构建的 digest，不能读可变 latest 标签。
      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: printf '%s' "$DIGEST" > "$RUNNER_TEMP/$ARCH"
      - uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}
          if-no-files-found: error
  merge:
    name: Publish multi-platform manifest
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 只有两个架构都成功才到此步骤；仅合并清单，不重新编译或等待 QEMU。
      - name: Combine the two published architectures
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tags=(-t "$image:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            "$image@$(cat "$RUNNER_TEMP/digests/amd64")" \
            "$image@$(cat "$RUNNER_TEMP/digests/arm64")"
